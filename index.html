<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>議事録作成</title>
<style>
  :root{--bg:#f4f6f8;--card:#fff;--ink:#1d2733;--sub:#6b7785;--line:#dde3ea;--main:#1f6feb;--rec:#d92d20;--ok:#1a7f4b}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Yu Gothic UI",Meiryo,sans-serif;font-size:15px;line-height:1.6}
  header{background:#17212b;color:#fff;padding:14px 18px;font-weight:700;font-size:17px}
  main{max-width:860px;margin:0 auto;padding:14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}
  h2{font-size:15px;margin:0 0 12px;color:var(--sub)}
  label{display:block;font-size:13px;color:var(--sub);margin:10px 0 4px}
  input[type=text],input[type=date],textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:7px;font:inherit;background:#fff}
  textarea{min-height:60px;resize:vertical}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media(max-width:560px){.grid{grid-template-columns:1fr}}
  .tabs{display:flex;gap:6px;margin-bottom:12px}
  .tab{flex:1;padding:10px;border:1px solid var(--line);background:#fff;border-radius:8px;cursor:pointer;font:inherit;font-weight:600}
  .tab.on{background:var(--main);color:#fff;border-color:var(--main)}
  .pane{display:none}.pane.on{display:block}
  .recbox{text-align:center;padding:10px 0}
  .timer{font-size:40px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:1px}
  .meter{height:8px;background:#e8edf2;border-radius:4px;overflow:hidden;margin:10px auto;max-width:360px}
  .meter i{display:block;height:100%;width:0;background:var(--ok);transition:width .08s}
  .btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:8px}
  button.b{padding:11px 20px;border:none;border-radius:8px;font:inherit;font-weight:700;cursor:pointer;color:#fff;background:var(--main)}
  button.b.rec{background:var(--rec)}
  button.b.gray{background:#fff;color:var(--ink);border:1px solid var(--line)}
  button.b:disabled{opacity:.4;cursor:not-allowed}
  .dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--rec);margin-right:6px;animation:bl 1s infinite}
  @keyframes bl{50%{opacity:.2}}
  .hint{font-size:12.5px;color:var(--sub);margin-top:8px}
  audio{width:100%;margin-top:12px}
  .file{border:2px dashed var(--line);border-radius:10px;padding:26px;text-align:center;color:var(--sub);cursor:pointer}
  .file.drag{border-color:var(--main);background:#eef4ff}
  .status{padding:12px;border-radius:8px;background:#eef4ff;color:#1f4fa8;margin-top:12px;display:none}
  .status.err{background:#fdecea;color:#a1271b}
  .status.show{display:block}
  .spin{display:inline-block;width:14px;height:14px;border:2px solid #9bb8ee;border-top-color:#1f6feb;border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px;margin-right:8px}
  @keyframes sp{to{transform:rotate(360deg)}}
  #result{display:none}
  .sec{margin-bottom:18px}
  .sec h3{font-size:14px;margin:0 0 6px;padding-left:8px;border-left:4px solid var(--main)}
  .sec p,.sec li{margin:3px 0}
  .sec ul{margin:0;padding-left:20px}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
  th{background:#f0f3f6}
  .transcript{white-space:pre-wrap;background:#fafbfc;border:1px solid var(--line);border-radius:8px;padding:10px;max-height:340px;overflow:auto;font-size:14px}
  [contenteditable]{outline:none}
  [contenteditable]:focus{background:#fffbe6}
</style>
</head>
<body>
<header>🎙 議事録作成</header>
<main>

  <div class="card">
    <h2>接続設定（変更する場合のみ）</h2>
    <label>GAS ウェブアプリURL（/exec）</label><input type="text" id="cfgUrl" placeholder="https://script.google.com/macros/s/.../exec">
    <div class="btns" style="justify-content:flex-start"><button class="b gray" id="btnCfg">保存</button></div>
  </div>

  <div class="card">
    <h2>会議情報（任意）</h2>
    <div class="grid">
      <div><label>会議名</label><input type="text" id="mTitle" placeholder="例：週次生産会議"></div>
      <div><label>日付</label><input type="date" id="mDate"></div>
    </div>
    <label>参加者</label><input type="text" id="mAtt" placeholder="例：桑原、田中、佐藤">
    <label>補足（専門用語・品番・人名の読みなど）</label><textarea id="mNote" placeholder="例：菰野溶接、大和事業部、マクロ検査 など"></textarea>
  </div>

  <div class="card">
    <h2>音声の入力</h2>
    <div class="tabs">
      <button class="tab on" data-t="rec">録音する</button>
      <button class="tab" data-t="file">ファイルを選ぶ</button>
    </div>

    <div class="pane on" id="p-rec">
      <div class="recbox">
        <div class="timer" id="timer">00:00</div>
        <div class="meter"><i id="meter"></i></div>
        <div id="recState" class="hint">待機中</div>
        <div class="btns">
          <button class="b rec" id="btnStart">● 録音開始</button>
          <button class="b gray" id="btnPause" disabled>一時停止</button>
          <button class="b" id="btnStop" disabled>■ 停止</button>
        </div>
        <div class="hint">録音は軽量設定（音声のみ）です。録音中は画面を閉じない・スリープさせないでください。</div>
      </div>
    </div>

    <div class="pane" id="p-file">
      <div class="file" id="drop">ここにドロップ、またはタップして選択<br><small>mp3 / m4a / wav / aac / ogg / flac / webm</small></div>
      <input type="file" id="fileIn" accept="audio/*" hidden>
      <div class="btns">
        <button class="b rec" id="btnCapture">🎤 スマホの録音アプリで録音</button>
      </div>
      <input type="file" id="capIn" accept="audio/*" capture hidden>
      <div class="hint">端末標準の録音機能を起動します。録音後、そのまま取り込まれます。（Androidは録音アプリが起動します。iPhoneは選択画面から「ボイスメモ」等を選んでください）</div>
    </div>

    <div id="preview" style="display:none">
      <audio id="player" controls></audio>
      <div class="hint" id="audInfo"></div>
      <div class="btns">
        <button class="b" id="btnGen">議事録を作成</button>
        <button class="b gray" id="btnClear">やり直す</button>
      </div>
    </div>

    <div class="status" id="status"></div>
  </div>

  <div class="card" id="result">
    <h2>議事録（クリックして直接編集できます）</h2>
    <div class="btns" style="justify-content:flex-start;margin:0 0 14px">
      <button class="b gray" id="btnCopy">コピー</button>
      <button class="b gray" id="btnMd">テキスト保存</button>
      <button class="b gray" id="btnDoc">Word保存</button>
    </div>
    <div id="doc"></div>
  </div>

</main>

<script>
(function(){
  const $ = id => document.getElementById(id);
  const MAX_BYTES = 14 * 1024 * 1024;   // base64化後に約19MB。Gemini inline上限(20MB)対策
  let blob = null, mime = '';
  let rec = null, chunks = [], stream = null, tickId = null, elapsed = 0, lastTick = 0;
  let actx = null, analyser = null, meterId = null, wakeLock = null;
  let data = null;

  $('mDate').value = new Date().toISOString().slice(0,10);

  // ---------- 接続設定（localStorage） ----------
  const DEFAULT_URL = 'https://script.google.com/macros/s/AKfycbxSTE8b-RdP5LC6r5YctrsWjJfekUGsDK_vTPFJjFQG0LqAyt19GydMD1ac7O8fneb9/exec';
  function getCfg(){
    try{ return { url: localStorage.getItem('minutes_url') || DEFAULT_URL }; }
    catch(e){ return { url: $('cfgUrl').value.trim() || DEFAULT_URL }; }
  }
  (function(){ const c = getCfg(); $('cfgUrl').value = c.url; })();
  $('btnCfg').onclick = () => {
    try{
      localStorage.setItem('minutes_url', $('cfgUrl').value.trim());
    }catch(e){}
    $('btnCfg').textContent = '保存しました'; setTimeout(() => $('btnCfg').textContent = '保存', 1500);
  };

  // ---------- タブ ----------
  document.querySelectorAll('.tab').forEach(t => t.onclick = () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x === t));
    $('p-rec').classList.toggle('on', t.dataset.t === 'rec');
    $('p-file').classList.toggle('on', t.dataset.t === 'file');
  });

  // ---------- 録音 ----------
  function pickMime(){
    const c = ['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg;codecs=opus'];
    return c.find(m => window.MediaRecorder && MediaRecorder.isTypeSupported(m)) || '';
  }
  const fmt = s => String(Math.floor(s/60)).padStart(2,'0') + ':' + String(Math.floor(s%60)).padStart(2,'0');

  function tick(){
    const now = Date.now();
    elapsed += (now - lastTick) / 1000; lastTick = now;
    $('timer').textContent = fmt(elapsed);
  }

  async function startRec(){
    try{
      stream = await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}});
    }catch(e){
      document.querySelector('.tab[data-t="file"]').click();
      return showStatus('マイクを使えません（' + e.name + '）。ブラウザのマイク許可を確認するか、「ファイルを選ぶ」タブの「スマホの録音アプリで録音」を使ってください。', true);
    }
    const mt = pickMime();
    rec = new MediaRecorder(stream, mt ? {mimeType: mt, audioBitsPerSecond: 32000} : {audioBitsPerSecond: 32000});
    chunks = [];
    rec.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
    rec.onstop = onRecStop;
    rec.start(1000);

    elapsed = 0; lastTick = Date.now();
    tickId = setInterval(tick, 250);
    setupMeter(stream);
    try{ if (navigator.wakeLock) wakeLock = await navigator.wakeLock.request('screen'); }catch(e){}

    $('btnStart').disabled = true; $('btnPause').disabled = false; $('btnStop').disabled = false;
    $('btnPause').textContent = '一時停止';
    $('recState').innerHTML = '<span class="dot"></span>録音中';
    $('preview').style.display = 'none';
    hideStatus();
  }

  function togglePause(){
    if (!rec) return;
    if (rec.state === 'recording'){
      rec.pause(); clearInterval(tickId);
      $('btnPause').textContent = '再開'; $('recState').textContent = '一時停止中';
    } else if (rec.state === 'paused'){
      rec.resume(); lastTick = Date.now(); tickId = setInterval(tick, 250);
      $('btnPause').textContent = '一時停止'; $('recState').innerHTML = '<span class="dot"></span>録音中';
    }
  }

  function stopRec(){
    if (rec && rec.state !== 'inactive') rec.stop();
  }

  function onRecStop(){
    clearInterval(tickId); cleanupMeter();
    stream && stream.getTracks().forEach(t => t.stop());
    if (wakeLock){ wakeLock.release().catch(()=>{}); wakeLock = null; }
    const type = (rec.mimeType || 'audio/webm');
    setAudio(new Blob(chunks, {type}), type);
    $('btnStart').disabled = false; $('btnPause').disabled = true; $('btnStop').disabled = true;
    $('recState').textContent = '録音完了（' + fmt(elapsed) + '）';
  }

  function setupMeter(s){
    try{
      actx = new (window.AudioContext || window.webkitAudioContext)();
      const src = actx.createMediaStreamSource(s);
      analyser = actx.createAnalyser(); analyser.fftSize = 512;
      src.connect(analyser);
      const buf = new Uint8Array(analyser.fftSize);
      const loop = () => {
        analyser.getByteTimeDomainData(buf);
        let peak = 0;
        for (let i = 0; i < buf.length; i++) peak = Math.max(peak, Math.abs(buf[i] - 128));
        $('meter').style.width = Math.min(100, peak / 128 * 140) + '%';
        meterId = requestAnimationFrame(loop);
      };
      loop();
    }catch(e){}
  }
  function cleanupMeter(){
    cancelAnimationFrame(meterId); $('meter').style.width = '0';
    if (actx){ actx.close().catch(()=>{}); actx = null; }
  }

  $('btnStart').onclick = startRec;
  $('btnPause').onclick = togglePause;
  $('btnStop').onclick = stopRec;

  // ---------- ファイル ----------
  const drop = $('drop');
  drop.onclick = () => $('fileIn').click();
  drop.ondragover = e => { e.preventDefault(); drop.classList.add('drag'); };
  drop.ondragleave = () => drop.classList.remove('drag');
  drop.ondrop = e => { e.preventDefault(); drop.classList.remove('drag'); if (e.dataTransfer.files[0]) loadFile(e.dataTransfer.files[0]); };
  $('fileIn').onchange = e => { if (e.target.files[0]) loadFile(e.target.files[0]); };
  $('btnCapture').onclick = () => $('capIn').click();
  $('capIn').onchange = e => { if (e.target.files[0]) loadFile(e.target.files[0]); };

  function guessMime(f){
    if (f.type) return f.type;
    const ext = (f.name.split('.').pop() || '').toLowerCase();
    return ({mp3:'audio/mpeg',m4a:'audio/mp4',wav:'audio/wav',aac:'audio/aac',ogg:'audio/ogg',flac:'audio/flac',webm:'audio/webm'})[ext] || 'audio/mpeg';
  }
  function loadFile(f){ setAudio(f, guessMime(f)); }

  function setAudio(b, type){
    blob = b; mime = type.split(';')[0];
    if (mime === 'audio/x-m4a') mime = 'audio/mp4';
    $('player').src = URL.createObjectURL(b);
    const mb = b.size / 1024 / 1024;
    $('audInfo').textContent = '形式: ' + mime + ' / サイズ: ' + mb.toFixed(1) + ' MB';
    $('preview').style.display = 'block';
    if (b.size > MAX_BYTES){
      showStatus('サイズが大きすぎます（上限 約14MB）。録音を分割するか、ビットレートを下げた音声に変換してください。', true);
      $('btnGen').disabled = true;
    } else { hideStatus(); $('btnGen').disabled = false; }
  }

  $('btnClear').onclick = () => {
    blob = null; $('preview').style.display = 'none'; $('player').removeAttribute('src');
    $('timer').textContent = '00:00'; $('recState').textContent = '待機中'; hideStatus();
  };

  // ---------- 生成 ----------
  function toBase64(b){
    return new Promise((res, rej) => {
      const r = new FileReader();
      r.onload = () => res(String(r.result).split(',')[1]);
      r.onerror = () => rej(new Error('音声の読み込みに失敗しました'));
      r.readAsDataURL(b);
    });
  }

  $('btnGen').onclick = async () => {
    if (!blob) return;
    $('btnGen').disabled = true; $('result').style.display = 'none';
    showStatus('<span class="spin"></span>文字起こし・要約中です…（数十秒〜数分かかります）');
    try{
      const b64 = await toBase64(blob);
      const meta = { title: $('mTitle').value.trim(), date: $('mDate').value,
                     attendees: $('mAtt').value.trim(), note: $('mNote').value.trim() };
      const cfg = getCfg();
      if (!cfg.url){
        showStatus('上の「接続設定」にGASのURLを入力して保存してください。', true);
        $('btnGen').disabled = false; return;
      }
      // Content-Typeを指定しない(text/plain)ことでCORSプリフライトを避ける
      fetch(cfg.url, { method: 'POST', body: JSON.stringify({ audio: b64, mime: mime, meta: meta }) })
        .then(r => r.json())
        .then(j => {
          if (j.error) throw new Error(j.error);
          data = j.result; render(data); hideStatus(); $('btnGen').disabled = false;
        })
        .catch(e => { showStatus('エラー: ' + (e.message || e), true); $('btnGen').disabled = false; });
    }catch(e){
      showStatus('エラー: ' + e.message, true); $('btnGen').disabled = false;
    }
  };

  // ---------- 表示 ----------
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  function render(r){
    const title = $('mTitle').value.trim() || r.title || '会議';
    const date = $('mDate').value, att = $('mAtt').value.trim();
    let h = '<div class="sec"><h3>' + esc(title) + '</h3><p>日付: ' + esc(date) + (att ? '　参加者: ' + esc(att) : '') + '</p></div>';
    h += '<div class="sec"><h3>概要</h3><p contenteditable>' + esc(r.summary) + '</p></div>';
    if (r.topics && r.topics.length){
      h += '<div class="sec"><h3>議題・討議内容</h3><ul>' +
        r.topics.map(t => '<li contenteditable><b>' + esc(t.subject) + '</b>：' + esc(t.content) + '</li>').join('') + '</ul></div>';
    }
    h += '<div class="sec"><h3>決定事項</h3>' + (r.decisions && r.decisions.length
      ? '<ul>' + r.decisions.map(d => '<li contenteditable>' + esc(d) + '</li>').join('') + '</ul>'
      : '<p>（なし）</p>') + '</div>';
    h += '<div class="sec"><h3>ToDo</h3>' + (r.todos && r.todos.length
      ? '<table><tr><th>内容</th><th>担当</th><th>期限</th></tr>' +
        r.todos.map(t => '<tr><td contenteditable>' + esc(t.task) + '</td><td contenteditable>' + esc(t.owner) + '</td><td contenteditable>' + esc(t.due) + '</td></tr>').join('') + '</table>'
      : '<p>（なし）</p>') + '</div>';
    h += '<div class="sec"><h3>文字起こし全文</h3><div class="transcript" contenteditable>' + esc(r.transcript) + '</div></div>';
    $('doc').innerHTML = h;
    $('result').style.display = 'block';
    $('result').scrollIntoView({behavior:'smooth'});
  }

  // ---------- 出力 ----------
  function toText(){
    const d = $('doc');
    const lines = [];
    d.querySelectorAll('.sec').forEach(sec => {
      const h = sec.querySelector('h3').textContent;
      lines.push('■ ' + h);
      const tbl = sec.querySelector('table');
      if (tbl){
        tbl.querySelectorAll('tr').forEach((tr, i) => {
          if (i === 0) return;
          const c = [...tr.children].map(x => x.textContent.trim());
          lines.push('・' + c[0] + '（担当: ' + (c[1] || '未定') + ' / 期限: ' + (c[2] || '未定') + '）');
        });
      } else if (sec.querySelector('li')){
        sec.querySelectorAll('li').forEach(li => lines.push('・' + li.textContent.trim()));
      } else {
        sec.querySelectorAll('p,.transcript').forEach(p => lines.push(p.textContent.trim()));
      }
      lines.push('');
    });
    return lines.join('\n');
  }
  function fname(ext){
    const t = ($('mTitle').value.trim() || (data && data.title) || '議事録').replace(/[\\/:*?"<>|]/g,'');
    return t + '_' + ($('mDate').value || '') + '.' + ext;
  }
  function download(content, type, name){
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([content], {type}));
    a.download = name; document.body.appendChild(a); a.click(); a.remove();
  }

  $('btnCopy').onclick = async () => {
    try{ await navigator.clipboard.writeText(toText()); }
    catch(e){
      const ta = document.createElement('textarea'); ta.value = toText();
      document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove();
    }
    $('btnCopy').textContent = 'コピーしました'; setTimeout(() => $('btnCopy').textContent = 'コピー', 1500);
  };
  $('btnMd').onclick = () => download('\ufeff' + toText(), 'text/plain;charset=utf-8', fname('txt'));
  $('btnDoc').onclick = () => {
    const html = '<html><head><meta charset="utf-8"><style>body{font-family:"Yu Gothic",Meiryo,sans-serif;font-size:10.5pt}' +
      'h3{border-left:4px solid #1f6feb;padding-left:6px;font-size:12pt}table{border-collapse:collapse}' +
      'th,td{border:1px solid #999;padding:4px 8px}.transcript{white-space:pre-wrap}</style></head><body>' +
      $('doc').innerHTML.replace(/ contenteditable(="[^"]*")?/g, '') + '</body></html>';
    download(html, 'application/msword', fname('doc'));
  };

  // ---------- 共通 ----------
  function showStatus(msg, err){
    const s = $('status'); s.innerHTML = msg; s.className = 'status show' + (err ? ' err' : '');
  }
  function hideStatus(){ $('status').className = 'status'; }
})();
</script>
</body>
</html>
